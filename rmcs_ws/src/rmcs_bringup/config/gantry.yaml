rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::Gantry -> gantry_hardware
      - rmcs_core::controller::gantry::GantryController -> gantry_controller
      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

gantry_hardware:
  ros__parameters:
    board_serial: "D4-6A83-030D-F3D0-9103-F8A5-1246"

gantry_controller:
  ros__parameters:
    lead: 0.002
    gear_ratio: 1.0
    target_height: 0.0
    max_velocity: 0.05
    max_acceleration: 0.2
    sync_coefficient: 0.3
    position_kp: 20.0
    position_ki: 0.0
    position_kd: 0.0
    velocity_kp: 0.3
    velocity_ki: 0.0
    velocity_kd: 0.001
