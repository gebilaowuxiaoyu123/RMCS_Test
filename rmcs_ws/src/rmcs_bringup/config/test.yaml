# ============================================================================
# 任务二 · 电机驱动演示启动配置
# 启动：ros2 launch rmcs_bringup rmcs.launch.py robot:=test
# 数据流（任务三：双环角度闭环）：
#   ros2 topic pub /motor_demo/angle_cmd <Float64 rad>  ← 外部角度目标
#     → AngleTargetController：当前角/目标角 卷绕误差 → /motor_demo/angle_error (优弧)
#     → 外环 ErrorPidController(角度环)：误差 → /motor_demo/target_velocity
#     → 内环 PidController(速度环)：速度误差 → /motor_demo/motor/control_torque → 电机
#   （任务二的速度环/固定目标/摇杆映射版本都注释保留在下方备用）
# ============================================================================
rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      # 硬件层：跟电机/遥控说话（test.cpp）
      - rmcs_core::hardware::MotorTest -> motor_test_hardware

      # 软件层：测速低通滤波
      - rmcs_core::controller::motor_demo::VelocityFilter -> motor_velocity_filter

      # 【方向诊断模式】固定速度 2 rad/s + 纯速度环 —— 判断转向 & 隔离抖动
      - rmcs_core::controller::motor_demo::FixedTargetVelocity -> motor_fixed_target
      # - rmcs_core::controller::motor_demo::AngleTargetController -> motor_angle_target        # (角度模式备用)
      # - rmcs_core::controller::motor_demo::JoystickVelocityMapping -> motor_joystick_mapping  # (遥控器模式备用)

      # 内环(速度环)：复用仓库 PidController
      - rmcs_core::controller::pid::PidController -> motor_speed_pid_controller

      # 观测接口：把内部 double 数据转发成真实 ROS2 话题（供 Foxglove / ros2 topic 使用）
      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

motor_test_hardware:
  ros__parameters:
    # CBoard 的 USB 序列号（lsusb -v 看到的 iSerial），不是路径！
    board_serial: "D4-6A83-030D-F3D0-9103-F8A5-1246"

# motor_joystick_mapping:   # （停用中，等遥控器再启用）
#   ros__parameters:
#     max_velocity: 5.0

motor_fixed_target:        # 【方向诊断】恒速 2 rad/s
  ros__parameters:
    value: 2.0

# motor_angle_pid_controller:   # 外环（角度模式，诊断期间停用）
#   ros__parameters:
#     measurement: /motor_demo/angle_error
#     control:     /motor_demo/target_velocity
#     kp: 2.0
#     ki: 0.0
#     kd: 0.0
#     output_min: -5.0
#     output_max: 5.0
#     integral_min: 0.0
#     integral_max: 0.0

motor_velocity_filter:
  ros__parameters:
    cutoff_frequency: 15.0      # 滤波截止(Hz)：kp 提高后更要压高频；还抖就再降到 10
    sampling_frequency: 1000.0  # 必须等于 update_rate

motor_speed_pid_controller:
  ros__parameters:
    measurement: /motor_demo/motor/velocity_filtered   # 反馈：滤波后测速(rad/s)
    setpoint: /motor_demo/target_velocity   # 目标：外环(角度环)算出的目标速度
    control:     /motor_demo/motor/control_torque      # 输出：扭矩(N·m)给电机
    kp: 0.4            # 实测：kp=1.0 会 bang-bang 抖振 → 降到 0.4（阻尼）；力不够靠 ki
    ki: 0.15           # 积分负责把最后一点顶到位（克服静摩擦），不怕慢
    kd: 0.0
    # 保护：扭矩限幅先收窄到 ±1 N·m（M3508 满幅≈6 N·m），调稳前别给大扭矩
    output_min: -1.0
    output_max: 1.0
    integral_min: 0.0
    integral_max: 0.0

value_broadcaster:
  ros__parameters:
    # 把这些内部 double 输出转发成同名 ROS2 话题（std_msgs/Float64）
    forward_list: [
      "/motor_demo/motor/angle",             # 实际角度(当前)
      "/motor_demo/angle_error",             # 角度误差(优弧卷绕后)
      "/motor_demo/target_velocity",         # 外环输出=内环目标速度
      "/motor_demo/motor/velocity",          # 原始测速
      "/motor_demo/motor/velocity_filtered", # 滤波后测速
      "/motor_demo/motor/control_torque",    # 给电机的扭矩
    ]
